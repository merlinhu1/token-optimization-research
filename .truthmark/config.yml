version: 2
truthmark:
  workspace: docs/truthmark
  generated:
    portal:
      enabled: false
instruction_targets:
  - AGENTS.md
frontmatter:
  required: []
  recommended:
    - status
    - doc_type
    - last_reviewed
    - source_of_truth
ignore:
  - node_modules/**
  - vendor/**
  - dist/**
  - build/**
